name: checks
on:
  pull_request:
    branches: [main]
  workflow_call:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Strip packageManager auto-pin
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.packageManager;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PNPM_MINIMUM_RELEASE_AGE: "0"
          PNPM_FETCH_TIMEOUT: "300000"
          PNPM_FETCH_RETRIES: "5"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify production build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/zmzai_ci?replicaSet=rs0
          AUTH_SECRET: ci-build-secret-0123456789abcdef0123456789
          WORKOS_SERVICE_SECRET_CURRENT: ci-service-secret-0123456789abcdef0123456789
